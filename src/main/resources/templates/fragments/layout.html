<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Volunteer Portal'">Volunteer Portal</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Volunteer Portal</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/home}" sec:authorize="isAuthenticated()">Home</a>
                <a class="nav-link" th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Admin</a>
                <span class="navbar-text text-white me-3" sec:authorize="isAuthenticated()">
                    Signed in as <span sec:authentication="name"></span>
                </span>
                <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
                <a class="nav-link" th:href="@{/login}" sec:authorize="isAnonymous()">Login</a>
                <a class="nav-link" th:href="@{/register}" sec:authorize="isAnonymous()">Register</a>
            </div>
        </div>
    </nav>

    <div th:fragment="scripts">
        <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    </div>
</body>
</html>
