<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Home')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title">Welcome, <span th:text="${user.username}">username</span></h2>
                <p class="card-text">Email: <span th:text="${user.email}"></span></p>
                <p class="card-text">Roles:</p>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" th:each="role : ${user.roles}" th:text="${role.name}"></li>
                </ul>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
