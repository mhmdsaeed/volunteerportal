<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{profile.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main id="main" class="container" style="max-width: 560px;">
        <h1 class="mb-4" th:text="#{profile.title}">My Profile</h1>

        <div class="alert alert-success" th:if="${param.saved != null}" th:text="#{profile.saved}">
            Profile saved.
        </div>

        <dl class="vp-standing">
            <dt th:text="#{common.grade}">Grade</dt>
            <dd th:text="${profile.grade != null ? profile.grade.name : #messages.msg('home.noGrade')}">Bronze</dd>
            <dt th:text="#{common.points}">Points</dt>
            <dd th:text="${profile.points != null ? profile.points : 0}">120</dd>
        </dl>

        <form th:action="@{/profile}" th:object="${profileForm}" method="post">
            <div class="mb-3">
                <label for="firstName" class="form-label" th:text="#{profile.firstName}">First Name</label>
                <input type="text" class="form-control" id="firstName" th:field="*{firstName}" th:errorclass="is-invalid"
                       th:aria-invalid="${#fields.hasErrors('firstName')} ? 'true'" th:aria-describedby="${#fields.hasErrors('firstName')} ? 'firstName-error'" autocomplete="given-name">
                <div class="text-danger" id="firstName-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
            </div>

            <div class="mb-3">
                <label for="lastName" class="form-label" th:text="#{profile.lastName}">Last Name</label>
                <input type="text" class="form-control" id="lastName" th:field="*{lastName}" th:errorclass="is-invalid"
                       th:aria-invalid="${#fields.hasErrors('lastName')} ? 'true'" th:aria-describedby="${#fields.hasErrors('lastName')} ? 'lastName-error'" autocomplete="family-name">
                <div class="text-danger" id="lastName-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
            </div>

            <div class="mb-3">
                <label for="mobile" class="form-label" th:text="#{profile.mobile}">Mobile</label>
                <input type="tel" class="form-control" id="mobile" th:field="*{mobile}" th:errorclass="is-invalid"
                       th:aria-invalid="${#fields.hasErrors('mobile')} ? 'true'" th:aria-describedby="${#fields.hasErrors('mobile')} ? 'mobile-error'" autocomplete="tel" dir="ltr">
                <div class="text-danger" id="mobile-error" th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}"></div>
            </div>

            <div class="mb-3">
                <label for="city" class="form-label" th:text="#{profile.city}">City</label>
                <input type="text" class="form-control" id="city" th:field="*{city}" th:errorclass="is-invalid"
                       th:aria-invalid="${#fields.hasErrors('city')} ? 'true'" th:aria-describedby="${#fields.hasErrors('city')} ? 'city-error'" autocomplete="address-level2">
                <div class="text-danger" id="city-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
            </div>

            <div class="mb-3">
                <label for="address" class="form-label" th:text="#{profile.address}">Address</label>
                <input type="text" class="form-control" id="address" th:field="*{address}" th:errorclass="is-invalid"
                       th:aria-invalid="${#fields.hasErrors('address')} ? 'true'" th:aria-describedby="${#fields.hasErrors('address')} ? 'address-error'" autocomplete="street-address">
                <div class="text-danger" id="address-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
        </form>

        <section id="password" class="mt-5" aria-labelledby="passwordHeading">
            <h2 class="h5 mb-3" id="passwordHeading" th:text="#{profile.password.heading}">Change password</h2>

            <div class="alert alert-success" th:if="${param.passwordChanged != null}" th:text="#{profile.password.changed}">
                Password changed.
            </div>

            <form th:action="@{/profile/password}" th:object="${passwordForm}" method="post">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label" th:text="#{profile.password.current}">Current password</label>
                    <input type="password" class="form-control" id="currentPassword" th:field="*{currentPassword}" th:errorclass="is-invalid"
                           th:aria-invalid="${#fields.hasErrors('currentPassword')} ? 'true'" th:aria-describedby="${#fields.hasErrors('currentPassword')} ? 'currentPassword-error'"
                           autocomplete="current-password" required>
                    <div class="text-danger" id="currentPassword-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label" th:text="#{profile.password.new}">New password</label>
                    <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}" th:errorclass="is-invalid"
                           th:aria-invalid="${#fields.hasErrors('newPassword')} ? 'true'" th:aria-describedby="${#fields.hasErrors('newPassword')} ? 'newPasswordHelp newPassword-error' : 'newPasswordHelp'"
                           autocomplete="new-password" required>
                    <div class="form-text" id="newPasswordHelp" th:text="#{profile.password.help}">At least 8 characters.</div>
                    <div class="text-danger" id="newPassword-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label" th:text="#{profile.password.confirm}">Confirm new password</label>
                    <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" th:errorclass="is-invalid"
                           th:aria-invalid="${#fields.hasErrors('confirmPassword')} ? 'true'" th:aria-describedby="${#fields.hasErrors('confirmPassword')} ? 'confirmPassword-error'"
                           autocomplete="new-password" required>
                    <div class="text-danger" id="confirmPassword-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>
                <button type="submit" class="btn btn-primary" th:text="#{profile.password.submit}">Change password</button>
            </form>
        </section>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
