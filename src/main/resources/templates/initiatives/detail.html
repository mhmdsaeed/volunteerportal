<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=${initiative.name})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container" style="max-width: 640px;">
        <p><a th:href="@{/initiatives}">&laquo; <span th:text="#{initiatives.back}">Back to Initiatives</span></a></p>

        <h2 th:text="${initiative.name}"></h2>
        <p class="text-muted" th:text="${initiative.description}"></p>
        <p th:if="${initiative.office != null}"><strong th:text="#{common.office} + ':'">Office:</strong> <span th:text="${initiative.office.name}"></span></p>

        <div th:if="${membership != null}" class="alert alert-info">
            <p class="mb-1" th:text="#{initiatives.requestedOn(${#temporals.format(membership.requestJoinDttm, 'yyyy-MM-dd HH:mm')})}">You requested to join on ...</p>
            <p class="mb-0" th:if="${membership.responseJoinDttm == null}"><span th:text="#{common.status} + ':'">Status:</span> <strong th:text="#{status.pendingReview}">Pending review</strong></p>
            <p class="mb-0" th:if="${membership.responseJoinDttm != null and membership.enabled == true}"><span th:text="#{common.status} + ':'">Status:</span> <strong th:text="#{status.approved}">Approved</strong></p>
            <p class="mb-0" th:if="${membership.responseJoinDttm != null and membership.enabled == false}"><span th:text="#{common.status} + ':'">Status:</span> <strong th:text="#{status.notApproved}">Not approved</strong></p>
            <p class="mb-0 mt-2 small" th:if="${membership.responseJoinDttm == null}" th:text="#{initiatives.pendingHint}">Once approved, you can attend this initiative's events.</p>
        </div>

        <div th:if="${membership != null and membership.enabled == true}" class="mb-4">
            <h4 class="mt-4" th:text="#{initiatives.eventsHeading}">Events</h4>
            <p class="small text-muted" th:text="#{initiatives.checkinHint}">At the event, scan the check-in QR code shown by the coordinator.</p>
            <div class="list-group">
                <div class="list-group-item" th:each="event : ${events}">
                    <div class="fw-semibold" th:text="${event.name}"></div>
                    <div class="small text-muted">
                        <span th:text="${event.fromDttm != null ? #temporals.format(event.fromDttm, 'yyyy-MM-dd HH:mm') : '-'}"></span>
                        <span th:if="${event.toDttm != null}"> &ndash; <span th:text="${#temporals.format(event.toDttm, 'yyyy-MM-dd HH:mm')}"></span></span>
                    </div>
                    <a th:if="${event.locUrl != null and !event.locUrl.isEmpty()}" th:href="${event.locUrl}" target="_blank" rel="noopener"
                       class="small" th:text="#{events.map}">Map</a>
                </div>
                <p th:if="${#lists.isEmpty(events)}" class="text-muted" th:text="#{initiatives.noEvents}">No events scheduled yet.</p>
            </div>
        </div>

        <form th:if="${membership != null and membership.responseJoinDttm == null}"
              th:action="@{/initiatives/{id}/withdraw(id=${initiative.id})}" method="post"
              th:data-confirm="#{initiatives.withdrawConfirm}" onsubmit="return confirm(this.dataset.confirm);">
            <button type="submit" class="btn btn-outline-danger btn-sm" th:text="#{initiatives.withdraw}">Withdraw Request</button>
        </form>

        <form th:if="${membership == null}" th:action="@{/initiatives/{id}/join(id=${initiative.id})}" method="post">
            <div class="mb-4" th:each="question : ${questions}"
                 th:with="choices=${question.questionChoicesText != null ? #strings.arraySplit(question.questionChoicesText, ',') : {}}">
                <label class="form-label" th:text="${question.questionText}"></label>

                <div th:switch="${question.questionTypeId}">
                    <div th:case="1">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:name="'answer_' + ${question.id}" value="1"
                                   th:id="'q' + ${question.id} + '-yes'">
                            <label class="form-check-label" th:for="'q' + ${question.id} + '-yes'" th:text="#{common.yes}">Yes</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:name="'answer_' + ${question.id}" value="0"
                                   th:id="'q' + ${question.id} + '-no'">
                            <label class="form-check-label" th:for="'q' + ${question.id} + '-no'" th:text="#{common.no}">No</label>
                        </div>
                    </div>

                    <div th:case="2">
                        <div class="form-check" th:each="choice, iter : ${choices}">
                            <input class="form-check-input" type="radio" th:name="'answer_' + ${question.id}"
                                   th:value="${iter.count}" th:id="'q' + ${question.id} + '-' + ${iter.count}">
                            <label class="form-check-label" th:for="'q' + ${question.id} + '-' + ${iter.count}" th:text="${#strings.trim(choice)}"></label>
                        </div>
                    </div>

                    <div th:case="3">
                        <div class="form-check" th:each="choice, iter : ${choices}">
                            <input class="form-check-input" type="checkbox" th:name="'answer_' + ${question.id}"
                                   th:value="${iter.count}" th:id="'q' + ${question.id} + '-' + ${iter.count}">
                            <label class="form-check-label" th:for="'q' + ${question.id} + '-' + ${iter.count}" th:text="${#strings.trim(choice)}"></label>
                        </div>
                    </div>

                    <div th:case="*">
                        <textarea class="form-control" th:name="'answer_' + ${question.id}" rows="2" dir="auto"></textarea>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{initiatives.join}">Request to Join</button>
        </form>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
