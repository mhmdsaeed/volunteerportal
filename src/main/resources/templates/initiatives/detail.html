<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title=${initiative.name})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container" style="max-width: 640px;">
        <p><a th:href="@{/initiatives}">&laquo; Back to Initiatives</a></p>

        <h2 th:text="${initiative.name}"></h2>
        <p class="text-muted" th:text="${initiative.description}"></p>
        <p th:if="${initiative.office != null}"><strong>Office:</strong> <span th:text="${initiative.office.name}"></span></p>

        <div th:if="${membership != null}" class="alert alert-info">
            <p class="mb-1">You requested to join on
                <span th:text="${#temporals.format(membership.requestJoinDttm, 'yyyy-MM-dd HH:mm')}"></span>.</p>
            <p class="mb-0" th:if="${membership.responseJoinDttm == null}">Status: <strong>Pending review</strong></p>
            <p class="mb-0" th:if="${membership.responseJoinDttm != null and membership.enabled == true}">Status: <strong>Approved</strong></p>
            <p class="mb-0" th:if="${membership.responseJoinDttm != null and membership.enabled == false}">Status: <strong>Not approved</strong></p>
        </div>

        <form th:if="${membership == null}" th:action="@{/initiatives/{id}/join(id=${initiative.id})}" method="post">
            <div class="mb-4" th:each="question : ${questions}"
                 th:with="choices=${question.questionChoicesText != null ? #strings.arraySplit(question.questionChoicesText, ',') : {}}">
                <label class="form-label" th:text="${question.questionText}"></label>

                <div th:switch="${question.questionTypeId}">
                    <div th:case="1">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:name="'answer_' + ${question.id}" value="1"
                                   th:id="'q' + ${question.id} + '-yes'">
                            <label class="form-check-label" th:for="'q' + ${question.id} + '-yes'">Yes</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:name="'answer_' + ${question.id}" value="0"
                                   th:id="'q' + ${question.id} + '-no'">
                            <label class="form-check-label" th:for="'q' + ${question.id} + '-no'">No</label>
                        </div>
                    </div>

                    <div th:case="2">
                        <div class="form-check" th:each="choice, iter : ${choices}">
                            <input class="form-check-input" type="radio" th:name="'answer_' + ${question.id}"
                                   th:value="${iter.count}" th:id="'q' + ${question.id} + '-' + ${iter.count}">
                            <label class="form-check-label" th:for="'q' + ${question.id} + '-' + ${iter.count}" th:text="${#strings.trim(choice)}"></label>
                        </div>
                    </div>

                    <div th:case="3">
                        <div class="form-check" th:each="choice, iter : ${choices}">
                            <input class="form-check-input" type="checkbox" th:name="'answer_' + ${question.id}"
                                   th:value="${iter.count}" th:id="'q' + ${question.id} + '-' + ${iter.count}">
                            <label class="form-check-label" th:for="'q' + ${question.id} + '-' + ${iter.count}" th:text="${#strings.trim(choice)}"></label>
                        </div>
                    </div>

                    <div th:case="*">
                        <textarea class="form-control" th:name="'answer_' + ${question.id}" rows="2"></textarea>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Request to Join</button>
        </form>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
