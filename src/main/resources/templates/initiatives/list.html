<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{initiatives.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <h2 class="mb-3" th:text="#{initiatives.title}">Initiatives</h2>

        <nav class="mb-4" th:aria-label="#{initiatives.filter.label}">
            <ul class="nav nav-pills vp-filter">
                <li class="nav-item" th:each="option : ${filters}">
                    <a class="nav-link" th:classappend="${option == filter} ? 'active'"
                       th:attr="aria-current=${option == filter} ? 'page'"
                       th:href="@{/initiatives(show=${option.param})}">
                        <span th:text="#{'initiatives.filter.' + ${option.param}}">Joined</span>
                        <span class="vp-filter-count" th:text="${counts.get(option)}">0</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="row row-cols-1 row-cols-md-2 g-3">
            <div class="col" th:each="initiative : ${initiatives}">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${initiative.name}"></h5>
                        <p class="card-text" th:text="${initiative.description}"></p>

                        <p th:with="membership=${memberships.get(initiative.id)}">
                            <span th:if="${membership == null}" class="badge text-bg-secondary" th:text="#{status.notJoined}">Not joined</span>
                            <span th:if="${membership != null and membership.responseJoinDttm == null}" class="badge text-bg-warning" th:text="#{status.pending}">Pending</span>
                            <span th:if="${membership != null and membership.responseJoinDttm != null and membership.enabled == true}" class="badge text-bg-success" th:text="#{status.approved}">Approved</span>
                            <span th:if="${membership != null and membership.responseJoinDttm != null and membership.enabled == false}" class="badge text-bg-danger" th:text="#{status.notApproved}">Not approved</span>
                        </p>

                        <a class="btn btn-primary btn-sm" th:href="@{/initiatives/{id}(id=${initiative.id})}" th:text="#{common.view}">View</a>
                    </div>
                </div>
            </div>
            <div class="col" th:if="${#lists.isEmpty(initiatives)}" th:switch="${filter.name()}">
                <th:block th:case="'JOINED'">
                    <p class="text-muted mb-2" th:text="#{initiatives.emptyJoined}">You haven't joined any initiatives yet.</p>
                    <a class="btn btn-primary btn-sm" th:href="@{/initiatives(show='notJoined')}"
                       th:text="#{initiatives.browseNotJoined}">Browse initiatives you can join</a>
                </th:block>
                <p th:case="'ALL'" class="text-muted" th:text="#{initiatives.empty}">No initiatives are open right now.</p>
                <p th:case="*" class="text-muted" th:text="#{initiatives.emptyFilter}">No initiatives here.</p>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
