<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Notifications')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container" style="max-width: 640px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Notifications</h2>
            <form th:if="${!#lists.isEmpty(notifications)}" th:action="@{/notifications/read-all}" method="post">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Mark all as read</button>
            </form>
        </div>

        <div class="list-group">
            <div class="list-group-item" th:each="notification : ${notifications}"
                 th:classappend="${notification.read} ? '' : 'list-group-item-light border-start border-4 border-primary'">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <p class="mb-1" th:text="${notification.message}"></p>
                        <a th:if="${notification.link != null}" th:href="${notification.link}" class="small">View</a>
                        <p class="mb-0 text-muted small" th:text="${#temporals.format(notification.createdDttm, 'yyyy-MM-dd HH:mm')}"></p>
                    </div>
                    <form th:if="${!notification.read}" th:action="@{/notifications/{id}/read(id=${notification.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-secondary">Mark read</button>
                    </form>
                </div>
            </div>
            <p th:if="${#lists.isEmpty(notifications)}" class="text-muted">No notifications yet.</p>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
