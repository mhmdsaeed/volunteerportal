<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Edit Volunteer')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container" style="max-width: 480px;">
        <p><a th:href="@{/admin/volunteers}">&laquo; Back to Volunteers</a></p>

        <h2 class="mb-4" th:text="'Edit Volunteer - ' + ${volunteer.username}">Edit Volunteer</h2>

        <form th:action="@{/admin/volunteers/{id}(id=${volunteer.id})}" th:object="${gradeForm}" method="post">

            <div class="mb-3">
                <label for="gradeId" class="form-label">Grade</label>
                <select class="form-select" id="gradeId" th:field="*{gradeId}">
                    <option value="">-- Unranked --</option>
                    <option th:each="grade : ${grades}" th:value="${grade.id}" th:text="${grade.name}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label for="points" class="form-label">Points</label>
                <input type="number" min="0" class="form-control" id="points" th:field="*{points}">
                <div class="text-danger" th:if="${#fields.hasErrors('points')}" th:errors="*{points}"></div>
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/volunteers}">Cancel</a>
        </form>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
