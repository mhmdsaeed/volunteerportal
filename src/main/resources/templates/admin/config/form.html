<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=${configId} != null ? #{config.edit} : #{config.new})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main id="main" class="container" style="max-width: 480px;">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
            <li th:replace="~{fragments/layout :: crumb(#{config.title}, '/admin/config')}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(${configId} != null ? #{config.edit} : #{config.new})}"></li>
        </ol></nav>

        <h1 class="mb-4" th:text="${configId} != null ? #{config.edit} : #{config.new}">Config</h1>

        <form th:action="${configId} != null ? @{/admin/config/{id}(id=${configId})} : @{/admin/config}"
              th:object="${configForm}" method="post">

            <div class="mb-3">
                <label for="configsetKey" class="form-label" th:text="#{common.key}">Key</label>
                <input type="text" class="form-control" id="configsetKey" th:field="*{configsetKey}" th:errorclass="is-invalid"
                       th:aria-invalid="${#fields.hasErrors('configsetKey')} ? 'true'" th:aria-describedby="${#fields.hasErrors('configsetKey')} ? 'configsetKey-error'" dir="ltr">
                <div class="text-danger" id="configsetKey-error" th:if="${#fields.hasErrors('configsetKey')}" th:errors="*{configsetKey}"></div>
            </div>

            <div class="mb-3">
                <label for="configsetValue" class="form-label" th:text="#{common.value}">Value</label>
                <input type="text" class="form-control" id="configsetValue" th:field="*{configsetValue}" th:errorclass="is-invalid"
                       th:aria-invalid="${#fields.hasErrors('configsetValue')} ? 'true'" th:aria-describedby="${#fields.hasErrors('configsetValue')} ? 'configsetValue-error'" dir="auto">
                <div class="text-danger" id="configsetValue-error" th:if="${#fields.hasErrors('configsetValue')}" th:errors="*{configsetValue}"></div>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/config}" th:text="#{common.cancel}">Cancel</a>
        </form>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
