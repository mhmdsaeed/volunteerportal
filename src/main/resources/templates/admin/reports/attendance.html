<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{reports.attendance})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
            <li th:replace="~{fragments/layout :: crumb(#{reports.title}, '/admin/reports')}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(#{reports.attendance})}"></li>
        </ol></nav>

        <h2 class="mb-4" th:text="#{reports.attendance}">Event Attendance</h2>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th th:text="#{common.initiative}">Initiative</th>
                        <th th:text="#{common.event}">Event</th>
                        <th th:text="#{common.from}">From</th>
                        <th th:text="#{reports.checkedIn}">Checked In</th>
                        <th th:text="#{reports.checkedOut}">Checked Out</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row : ${rows}">
                        <td><bdi th:text="${row.initiativeName != null ? row.initiativeName : '-'}"></bdi></td>
                        <td><bdi th:text="${row.eventName}"></bdi></td>
                        <td th:text="${row.fromDttm != null ? #temporals.format(row.fromDttm, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                        <td th:text="${row.checkInCount}"></td>
                        <td th:text="${row.checkOutCount}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td colspan="5" class="text-muted" th:text="#{reports.noEvents}">No events yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
