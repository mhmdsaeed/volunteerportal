<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{reports.initiatives})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main id="main" class="container">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
            <li th:replace="~{fragments/layout :: crumb(#{reports.title}, '/admin/reports')}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(#{reports.initiatives})}"></li>
        </ol></nav>

        <h1 class="mb-4" th:text="#{reports.initiatives}">Initiative Participation</h1>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th th:text="#{common.initiative}">Initiative</th>
                        <th th:text="#{common.office}">Office</th>
                        <th th:text="#{common.supervisor}">Supervisor</th>
                        <th th:text="#{status.approved}">Approved</th>
                        <th th:text="#{status.pending}">Pending</th>
                        <th th:text="#{status.rejected}">Rejected</th>
                        <th th:text="#{common.total}">Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row : ${rows}">
                        <td><bdi th:text="${row.initiativeName}"></bdi></td>
                        <td><bdi th:text="${row.officeName != null ? row.officeName : '-'}"></bdi></td>
                        <td><bdi th:text="${row.supervisorUsername != null ? row.supervisorUsername : '-'}"></bdi></td>
                        <td th:text="${row.approvedCount}"></td>
                        <td th:text="${row.pendingCount}"></td>
                        <td th:text="${row.rejectedCount}"></td>
                        <td th:text="${row.totalCount}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td colspan="7" class="text-muted" th:text="#{reports.noInitiatives}">No initiatives yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
