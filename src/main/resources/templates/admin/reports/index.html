<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{reports.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main id="main" class="container">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(#{reports.title})}"></li>
        </ol></nav>

        <h1 class="mb-4" th:text="#{reports.title}">Reports</h1>

        <div class="list-group vp-link-list vp-link-list-narrow">
            <a class="list-group-item list-group-item-action" th:href="@{/admin/reports/initiatives}">
                <i class="bi bi-person-check" aria-hidden="true"></i>
                <span><span class="vp-link-label" th:text="#{reports.initiatives}">Initiative Participation</span>
                    <small class="d-block text-muted" th:text="#{reports.initiatives.help}">Each initiative's members.</small></span>
            </a>
            <a class="list-group-item list-group-item-action" th:href="@{/admin/reports/attendance}">
                <i class="bi bi-calendar-check" aria-hidden="true"></i>
                <span><span class="vp-link-label" th:text="#{reports.attendance}">Event Attendance</span>
                    <small class="d-block text-muted" th:text="#{reports.attendance.help}">Check-ins and check-outs per event.</small></span>
            </a>
            <a class="list-group-item list-group-item-action" th:href="@{/admin/reports/volunteers}">
                <i class="bi bi-list-ol" aria-hidden="true"></i>
                <span><span class="vp-link-label" th:text="#{reports.volunteers}">Volunteer Leaderboard</span>
                    <small class="d-block text-muted" th:text="#{reports.volunteers.help}">Volunteers ranked by points.</small></span>
            </a>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
