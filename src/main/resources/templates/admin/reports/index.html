<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{reports.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(#{reports.title})}"></li>
        </ol></nav>

        <h2 class="mb-4" th:text="#{reports.title}">Reports</h2>

        <a class="btn btn-outline-primary" th:href="@{/admin/reports/initiatives}" th:text="#{reports.initiatives}">Initiative Participation</a>
        <a class="btn btn-outline-primary" th:href="@{/admin/reports/attendance}" th:text="#{reports.attendance}">Event Attendance</a>
        <a class="btn btn-outline-primary" th:href="@{/admin/reports/volunteers}" th:text="#{reports.volunteers}">Volunteer Leaderboard</a>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
