<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{reports.volunteers})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
            <li th:replace="~{fragments/layout :: crumb(#{reports.title}, '/admin/reports')}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(#{reports.volunteers})}"></li>
        </ol></nav>

        <h2 class="mb-4" th:text="#{reports.volunteers}">Volunteer Leaderboard</h2>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>#</th>
                        <th th:text="#{common.volunteer}">Volunteer</th>
                        <th th:text="#{common.grade}">Grade</th>
                        <th th:text="#{common.points}">Points</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row, iter : ${rows}">
                        <td th:text="${iter.count}"></td>
                        <td><bdi th:text="${row.username}"></bdi></td>
                        <td><bdi th:text="${row.gradeName != null ? row.gradeName : #messages.msg('grade.unranked')}"></bdi></td>
                        <td th:text="${row.points}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td colspan="4" class="text-muted" th:text="#{reports.noVolunteers}">No volunteers yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
