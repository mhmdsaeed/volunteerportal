<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=${categoryId} != null ? #{questionLibrary.editCategory} : #{questionLibrary.newCategory})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main id="main" class="container" style="max-width: 560px;">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
            <li th:replace="~{fragments/layout :: crumb(#{questionLibrary.title}, '/admin/question-library')}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(${categoryId} != null ? #{questionLibrary.editCategory} : #{questionLibrary.newCategory})}"></li>
        </ol></nav>

        <h1 class="mb-4" th:text="${categoryId} != null ? #{questionLibrary.editCategory} : #{questionLibrary.newCategory}">Category</h1>

        <form th:action="${categoryId} != null ? @{/admin/question-library/{id}(id=${categoryId})} : @{/admin/question-library}"
              th:object="${categoryForm}" method="post">

            <div class="mb-3">
                <label for="name" class="form-label" th:text="#{common.name}">Name</label>
                <input type="text" class="form-control" id="name" th:field="*{name}">
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label" th:text="#{common.description}">Description</label>
                <textarea class="form-control" id="description" rows="3" th:field="*{description}"></textarea>
                <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/question-library}" th:text="#{common.cancel}">Cancel</a>
        </form>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
