<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title=${questionId} != null ? 'Edit Question' : 'New Question')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container" style="max-width: 560px;">
        <p><a th:href="@{/admin/question-library/{id}/questions(id=${category.id})}">&laquo; Back to Questions</a></p>

        <h2 class="mb-4" th:text="(${questionId} != null ? 'Edit Question' : 'New Question') + ' - ' + ${category.name}">Question</h2>

        <form th:action="${questionId} != null
                    ? @{/admin/question-library/{categoryId}/questions/{id}(categoryId=${category.id},id=${questionId})}
                    : @{/admin/question-library/{categoryId}/questions(categoryId=${category.id})}"
              th:object="${questionForm}" method="post">

            <div class="mb-3">
                <label for="questionText" class="form-label">Question</label>
                <textarea class="form-control" id="questionText" rows="2" th:field="*{questionText}"></textarea>
                <div class="text-danger" th:if="${#fields.hasErrors('questionText')}" th:errors="*{questionText}"></div>
            </div>

            <div class="mb-3">
                <label for="questionType" class="form-label">Type</label>
                <select class="form-select" id="questionType" th:field="*{questionType}">
                    <option value="1">True / False</option>
                    <option value="2">Single choice</option>
                    <option value="3">Multiple choice</option>
                    <option value="4">Free text</option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('questionType')}" th:errors="*{questionType}"></div>
            </div>

            <div class="mb-3">
                <label for="questionChoicesCount" class="form-label">Number of choices</label>
                <input type="number" class="form-control" id="questionChoicesCount" th:field="*{questionChoicesCount}">
                <div class="form-text">Only relevant for single/multiple choice questions.</div>
            </div>

            <div class="mb-3">
                <label for="questionChoices" class="form-label">Choices</label>
                <input type="text" class="form-control" id="questionChoices" th:field="*{questionChoices}"
                       placeholder="Comma-separated, e.g. Red,Green,Blue">
                <div class="text-danger" th:if="${#fields.hasErrors('questionChoices')}" th:errors="*{questionChoices}"></div>
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/question-library/{id}/questions(id=${category.id})}">Cancel</a>
        </form>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
