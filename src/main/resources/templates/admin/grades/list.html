<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{grades.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main id="main" class="container">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(#{grades.title})}"></li>
        </ol></nav>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h1 th:text="#{grades.title}">Grades</h1>
            <a class="btn btn-primary" th:href="@{/admin/grades/new}" th:text="#{grades.new}">New Grade</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th th:text="#{common.name}">Name</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="grade : ${grades}">
                        <td><bdi th:text="${grade.name}"></bdi></td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/grades/{id}/edit(id=${grade.id})}" th:text="#{common.edit}">Edit</a>
                            <form th:action="@{/admin/grades/{id}/delete(id=${grade.id})}" method="post" class="d-inline"
                                  th:data-confirm="#{grades.confirmDelete}" onsubmit="return confirm(this.dataset.confirm);">
                                <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{common.delete}">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(grades)}">
                        <td colspan="2" class="text-muted" th:text="#{grades.empty}">No grades yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
