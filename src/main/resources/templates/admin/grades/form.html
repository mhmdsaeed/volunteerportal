<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=${gradeId} != null ? #{grades.edit} : #{grades.new})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main id="main" class="container" style="max-width: 480px;">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
            <li th:replace="~{fragments/layout :: crumb(#{grades.title}, '/admin/grades')}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(${gradeId} != null ? #{grades.edit} : #{grades.new})}"></li>
        </ol></nav>

        <h1 class="mb-4" th:text="${gradeId} != null ? #{grades.edit} : #{grades.new}">Grade</h1>

        <form th:action="${gradeId} != null ? @{/admin/grades/{id}(id=${gradeId})} : @{/admin/grades}"
              th:object="${gradeForm}" method="post">

            <div class="mb-3">
                <label for="name" class="form-label" th:text="#{common.name}">Name</label>
                <input type="text" class="form-control" id="name" th:field="*{name}">
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/grades}" th:text="#{common.cancel}">Cancel</a>
        </form>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
