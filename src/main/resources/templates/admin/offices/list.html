<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Offices')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Offices</h2>
            <a class="btn btn-primary" th:href="@{/admin/offices/new}">New Office</a>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Role</th>
                    <th>User</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="office : ${offices}">
                    <td th:text="${office.name}"></td>
                    <td th:text="${office.role != null ? office.role.name : '-'}"></td>
                    <td th:text="${office.user != null ? office.user.username : '-'}"></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/offices/{id}/edit(id=${office.id})}">Edit</a>
                        <form th:action="@{/admin/offices/{id}/delete(id=${office.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this office?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(offices)}">
                    <td colspan="4" class="text-muted">No offices yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
