<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=${officeId} != null ? #{offices.edit} : #{offices.new})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container" style="max-width: 560px;">
        <h2 class="mb-4" th:text="${officeId} != null ? #{offices.edit} : #{offices.new}">Office</h2>

        <form th:action="${officeId} != null ? @{/admin/offices/{id}(id=${officeId})} : @{/admin/offices}"
              th:object="${officeForm}" method="post">

            <div class="mb-3">
                <label for="name" class="form-label" th:text="#{common.name}">Name</label>
                <input type="text" class="form-control" id="name" th:field="*{name}">
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label" th:text="#{common.description}">Description</label>
                <textarea class="form-control" id="description" rows="3" th:field="*{description}"></textarea>
                <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="mb-3">
                <label for="roleId" class="form-label" th:text="#{common.role}">Role</label>
                <select class="form-select" id="roleId" th:field="*{roleId}">
                    <option value="" th:text="#{common.none}">-- None --</option>
                    <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label for="userId" class="form-label" th:text="#{common.user}">User</label>
                <select class="form-select" id="userId" th:field="*{userId}">
                    <option value="" th:text="#{common.none}">-- None --</option>
                    <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/offices}" th:text="#{common.cancel}">Cancel</a>
        </form>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
