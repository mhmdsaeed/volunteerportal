<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{users.editRoles})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main id="main" class="container" style="max-width: 560px;">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
            <li th:replace="~{fragments/layout :: crumb(#{users.title}, '/admin/users')}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(${user.username})}"></li>
        </ol></nav>

        <h1 class="mb-1" th:text="#{users.editHeading(${user.username})}">Roles</h1>
        <p class="text-muted"><span class="vp-break" dir="ltr" th:text="${user.email}"></span></p>

        <div class="alert alert-danger" th:if="${errorKey != null}" th:text="${#messages.msg(errorKey)}">Error.</div>

        <form th:action="@{/admin/users/{id}(id=${user.id})}" method="post">
            <div class="list-group mb-3">
                <label class="list-group-item d-flex gap-3" th:each="role : ${allRoles}">
                    <input class="form-check-input flex-shrink-0 mt-1" type="checkbox" name="roles"
                           th:value="${role.name}" th:checked="${selected.contains(role.name)}"
                           th:id="'role-' + ${role.name}">
                    <span>
                        <span class="fw-semibold" th:text="${#messages.msgOrNull('role.' + role.name) ?: role.name}">Role</span>
                        <small class="d-block text-muted" th:text="${#messages.msgOrNull('role.' + role.name + '.help')}">What it allows</small>
                    </span>
                </label>
            </div>

            <p class="small text-muted" th:if="${isSelf}" th:text="#{users.selfNote}">You can't remove your own admin role.</p>
            <p class="small text-muted" th:text="#{users.takesEffect}">Takes effect next login.</p>

            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/users}" th:text="#{common.cancel}">Cancel</a>
        </form>

        <section class="mt-5" aria-labelledby="setPasswordHeading">
            <h2 class="h5 mb-2" id="setPasswordHeading" th:text="#{users.setPassword.heading}">Set a new password</h2>
            <p class="small text-muted" th:if="${isSelf}">
                <a th:href="@{/profile#password}" th:text="#{users.setPassword.self}">To change your own password, use My Profile.</a>
            </p>
            <form th:unless="${isSelf}" th:action="@{/admin/users/{id}/password(id=${user.id})}" th:object="${passwordForm}" method="post">
                <p class="small text-muted" th:text="#{users.setPassword.help}">For someone who forgot their password.</p>
                <div class="mb-3">
                    <label for="newPassword" class="form-label" th:text="#{profile.password.new}">New password</label>
                    <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}" th:errorclass="is-invalid"
                           th:aria-invalid="${#fields.hasErrors('newPassword')} ? 'true'" th:aria-describedby="${#fields.hasErrors('newPassword')} ? 'newPassword-error'"
                           autocomplete="new-password" required>
                    <div class="text-danger" id="newPassword-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label" th:text="#{profile.password.confirm}">Confirm new password</label>
                    <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" th:errorclass="is-invalid"
                           th:aria-invalid="${#fields.hasErrors('confirmPassword')} ? 'true'" th:aria-describedby="${#fields.hasErrors('confirmPassword')} ? 'confirmPassword-error'"
                           autocomplete="new-password" required>
                    <div class="text-danger" id="confirmPassword-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>
                <button type="submit" class="btn btn-outline-primary" th:text="#{users.setPassword.submit}">Set password</button>
            </form>
        </section>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
