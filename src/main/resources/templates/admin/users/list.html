<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{users.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main id="main" class="container">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(#{users.title})}"></li>
        </ol></nav>

        <h1 class="mb-1" th:text="#{users.title}">Users</h1>
        <p class="text-muted mb-4" th:text="#{users.intro}">Change what each account can do.</p>

        <div class="alert alert-success" th:if="${savedUser != null}" th:text="#{users.saved(${savedUser})}">Saved.</div>
        <div class="alert alert-success" th:if="${activatedUser != null}" th:text="#{users.activated(${activatedUser})}">Activated.</div>
        <div class="alert alert-warning" th:if="${deactivatedUser != null}" th:text="#{users.deactivated(${deactivatedUser})}">Deactivated.</div>
        <div class="alert alert-success" th:if="${passwordSetUser != null}" th:text="#{users.passwordSet(${passwordSetUser})}">Password set.</div>
        <div class="alert alert-danger" th:if="${errorKey != null}" th:text="${#messages.msg(errorKey)}">Error.</div>

        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th th:text="#{common.username}">Username</th>
                        <th th:text="#{common.email}">Email</th>
                        <th th:text="#{users.roles}">Roles</th>
                        <th th:text="#{common.status}">Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td><bdi th:text="${u.username}"></bdi></td>
                        <td><span class="vp-break" dir="ltr" th:text="${u.email}"></span></td>
                        <td>
                            <span th:each="role : ${u.roles}" class="badge me-1"
                                  th:classappend="${role.name == 'ADMIN'} ? 'text-bg-danger' : (${role.name == 'COORDINATOR'} ? 'text-bg-primary' : 'text-bg-secondary')"
                                  th:text="${#messages.msgOrNull('role.' + role.name) ?: role.name}">ROLE</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${u.enabled} ? 'text-bg-success' : 'text-bg-secondary'"
                                  th:text="${u.enabled} ? #{users.enabled} : #{users.disabled}">Active</span>
                        </td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/users/{id}/edit(id=${u.id})}" th:text="#{users.editRoles}">Edit roles</a>
                            <th:block th:if="${u.id != currentUserId}">
                                <form th:if="${u.enabled}" th:action="@{/admin/users/{id}/deactivate(id=${u.id})}" method="post" class="d-inline"
                                      th:data-confirm="#{users.deactivateConfirm(${u.username})}" onsubmit="return confirm(this.dataset.confirm);">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{users.deactivate}">Deactivate</button>
                                </form>
                                <form th:unless="${u.enabled}" th:action="@{/admin/users/{id}/activate(id=${u.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-success" th:text="#{users.activate}">Activate</button>
                                </form>
                            </th:block>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="5" class="text-muted" th:text="#{users.empty}">No users.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
