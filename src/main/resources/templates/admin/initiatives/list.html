<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Initiatives')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Initiatives</h2>
            <a class="btn btn-primary" th:href="@{/admin/initiatives/new}">New Initiative</a>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Office</th>
                    <th>Supervisor</th>
                    <th>Enabled</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="initiative : ${initiatives}">
                    <td th:text="${initiative.name}"></td>
                    <td th:text="${initiative.office != null ? initiative.office.name : '-'}"></td>
                    <td th:text="${initiative.supervisor != null ? initiative.supervisor.username : '-'}"></td>
                    <td th:text="${initiative.enabled != null and initiative.enabled ? 'Yes' : 'No'}"></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/initiatives/{id}/events(id=${initiative.id})}">Events</a>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/initiatives/{id}/questions(id=${initiative.id})}">Questions</a>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/initiatives/{id}/export(id=${initiative.id})}">Export CSV</a>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/initiatives/{id}/edit(id=${initiative.id})}">Edit</a>
                        <form th:action="@{/admin/initiatives/{id}/delete(id=${initiative.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this initiative?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(initiatives)}">
                    <td colspan="5" class="text-muted">No initiatives yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
