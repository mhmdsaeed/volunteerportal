<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{initiatives.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main id="main" class="container">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(#{initiatives.title})}"></li>
        </ol></nav>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h1 th:text="#{initiatives.title}">Initiatives</h1>
            <a class="btn btn-primary" th:href="@{/admin/initiatives/new}" th:text="#{adminInitiatives.new}">New Initiative</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th th:text="#{common.name}">Name</th>
                        <th th:text="#{common.office}">Office</th>
                        <th th:text="#{common.supervisor}">Supervisor</th>
                        <th th:text="#{common.enabled}">Enabled</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="initiative : ${initiatives}">
                        <td><bdi th:text="${initiative.name}"></bdi></td>
                        <td><bdi th:text="${initiative.office != null ? initiative.office.name : '-'}"></bdi></td>
                        <td><bdi th:text="${initiative.supervisor != null ? initiative.supervisor.username : '-'}"></bdi></td>
                        <td th:text="${initiative.enabled != null and initiative.enabled} ? #{common.yes} : #{common.no}"></td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/initiatives/{id}/events(id=${initiative.id})}" th:text="#{adminInitiatives.events}">Events</a>
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/initiatives/{id}/questions(id=${initiative.id})}" th:text="#{common.questions}">Questions</a>
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/initiatives/{id}/export(id=${initiative.id})}" th:text="#{adminInitiatives.exportCsv}">Export CSV</a>
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/initiatives/{id}/edit(id=${initiative.id})}" th:text="#{common.edit}">Edit</a>
                            <form th:action="@{/admin/initiatives/{id}/duplicate(id=${initiative.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="#{adminInitiatives.duplicate}">Duplicate</button>
                            </form>
                            <form th:action="@{/admin/initiatives/{id}/delete(id=${initiative.id})}" method="post" class="d-inline"
                                  th:data-confirm="#{adminInitiatives.confirmDelete}" onsubmit="return confirm(this.dataset.confirm);">
                                <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{common.delete}">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(initiatives)}">
                        <td colspan="5" class="text-muted" th:text="#{adminInitiatives.empty}">No initiatives yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
