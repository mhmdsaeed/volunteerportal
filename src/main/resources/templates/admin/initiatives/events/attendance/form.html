<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=${attendId} != null ? #{attendance.edit} : #{attendance.record})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Shared by the admin area and the coordinator pages: attendancePath/eventsPath default to the admin URLs -->
    <main id="main" class="container" style="max-width: 560px;"
         th:with="eventsPath=${eventsPath != null ? eventsPath : '/admin/initiatives/' + initiative.id + '/events'},
                  attendancePath=${attendancePath != null ? attendancePath : eventsPath + '/' + event.id + '/attendance'}">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb" th:with="fromCoordinator=${#strings.startsWith(eventsPath, '/coordinator')}">
            <th:block th:if="${fromCoordinator}">
                <li th:replace="~{fragments/layout :: crumb(#{nav.coordinator}, '/coordinator/initiatives')}"></li>
                <li th:replace="~{fragments/layout :: crumbText(${initiative.name})}"></li>
            </th:block>
            <th:block th:unless="${fromCoordinator}">
                <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
                <li th:replace="~{fragments/layout :: crumb(#{initiatives.title}, '/admin/initiatives')}"></li>
                <li th:replace="~{fragments/layout :: crumb(${initiative.name}, ${'/admin/initiatives/' + initiative.id + '/edit'})}"></li>
            </th:block>
            <li th:replace="~{fragments/layout :: crumb(#{adminInitiatives.events}, ${eventsPath})}"></li>
            <li th:replace="~{fragments/layout :: crumbText(${event.name})}"></li>
            <li th:replace="~{fragments/layout :: crumb(#{attendance.title}, ${attendancePath})}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(${attendId} != null ? #{attendance.edit} : #{attendance.record})}"></li>
        </ol></nav>

        <h1 class="mb-4" th:text="${attendId} != null ? #{attendance.editHeading(${event.name})} : #{attendance.recordHeading(${event.name})}">Attendance</h1>

        <form th:action="${attendId} != null ? @{|${attendancePath}/${attendId}|} : @{${attendancePath}}"
              th:object="${attendForm}" method="post">

            <div class="mb-3">
                <label for="volunteerInitiativeId" class="form-label" th:text="#{common.volunteer}">Volunteer</label>
                <select class="form-select" id="volunteerInitiativeId" th:field="*{volunteerInitiativeId}">
                    <option value="" th:text="#{common.select}">-- Select --</option>
                    <option th:each="vi : ${volunteerInitiatives}" th:value="${vi.id}"
                            th:text="${vi.user != null ? vi.user.username : #messages.msg('attendance.volunteerFallback', vi.id)}"></option>
                </select>
                <div class="form-text" th:text="#{attendance.onlyApprovedHint}">Only volunteers whose join request was approved are listed.</div>
                <div class="text-danger" th:if="${#fields.hasErrors('volunteerInitiativeId')}" th:errors="*{volunteerInitiativeId}"></div>
            </div>

            <div class="mb-3">
                <label for="attendInOut" class="form-label" th:text="#{common.type}">Type</label>
                <select class="form-select" id="attendInOut" th:field="*{attendInOut}">
                    <option value="1" th:text="#{attend.type.1}">Check-in</option>
                    <option value="2" th:text="#{attend.type.2}">Check-out</option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('attendInOut')}" th:errors="*{attendInOut}"></div>
            </div>

            <div class="mb-3">
                <label for="attendDttm" class="form-label" th:text="#{common.when}">When</label>
                <input type="datetime-local" class="form-control" id="attendDttm" th:field="*{attendDttm}">
            </div>

            <div class="mb-3">
                <label for="note" class="form-label" th:text="#{common.note}">Note</label>
                <input type="text" class="form-control" id="note" th:field="*{note}">
                <div class="text-danger" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></div>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
            <a class="btn btn-outline-secondary"
               th:href="@{${attendancePath}}" th:text="#{common.cancel}">Cancel</a>
        </form>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
