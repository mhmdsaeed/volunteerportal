<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{attendance.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Shared by the admin area and the coordinator pages: attendancePath/eventsPath default to the admin URLs -->
    <main id="main" class="container"
         th:with="eventsPath=${eventsPath != null ? eventsPath : '/admin/initiatives/' + initiative.id + '/events'},
                  attendancePath=${attendancePath != null ? attendancePath : eventsPath + '/' + event.id + '/attendance'}">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb" th:with="fromCoordinator=${#strings.startsWith(eventsPath, '/coordinator')}">
            <th:block th:if="${fromCoordinator}">
                <li th:replace="~{fragments/layout :: crumb(#{nav.coordinator}, '/coordinator/initiatives')}"></li>
                <li th:replace="~{fragments/layout :: crumbText(${initiative.name})}"></li>
            </th:block>
            <th:block th:unless="${fromCoordinator}">
                <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
                <li th:replace="~{fragments/layout :: crumb(#{initiatives.title}, '/admin/initiatives')}"></li>
                <li th:replace="~{fragments/layout :: crumb(${initiative.name}, ${'/admin/initiatives/' + initiative.id + '/edit'})}"></li>
            </th:block>
            <li th:replace="~{fragments/layout :: crumb(#{adminInitiatives.events}, ${eventsPath})}"></li>
            <li th:replace="~{fragments/layout :: crumbText(${event.name})}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(#{attendance.title})}"></li>
        </ol></nav>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h1 th:text="#{attendance.heading(${event.name})}">Attendance</h1>
            <a class="btn btn-primary"
               th:href="@{|${attendancePath}/new|}" th:text="#{attendance.record}">Record Attendance</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th th:text="#{common.volunteer}">Volunteer</th>
                        <th th:text="#{common.type}">Type</th>
                        <th th:text="#{common.when}">When</th>
                        <th th:text="#{common.note}">Note</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="attend : ${attendances}">
                        <td><bdi th:text="${attend.volunteerInitiative != null and attend.volunteerInitiative.user != null ? attend.volunteerInitiative.user.username : '-'}"></bdi></td>
                        <td th:switch="${attend.attendInOut}">
                            <span th:case="1" th:text="#{attend.type.1}">Check-in</span>
                            <span th:case="2" th:text="#{attend.type.2}">Check-out</span>
                            <span th:case="*">-</span>
                        </td>
                        <td th:text="${attend.attendDttm != null ? #temporals.format(attend.attendDttm, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                        <td><bdi th:text="${attend.note != null ? attend.note : '-'}"></bdi></td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{|${attendancePath}/${attend.id}/edit|}" th:text="#{common.edit}">Edit</a>
                            <form th:action="@{|${attendancePath}/${attend.id}/delete|}"
                                  method="post" class="d-inline" th:data-confirm="#{attendance.confirmDelete}" onsubmit="return confirm(this.dataset.confirm);">
                                <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{common.delete}">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(attendances)}">
                        <td colspan="5" class="text-muted" th:text="#{attendance.empty}">No attendance recorded yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
