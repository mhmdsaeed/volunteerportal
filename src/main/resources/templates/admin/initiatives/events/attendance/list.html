<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{attendance.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <p><a th:href="@{/admin/initiatives/{id}/events(id=${initiative.id})}">&laquo; <span th:text="#{events.back}">Back to Events</span></a></p>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 th:text="#{attendance.heading(${event.name})}">Attendance</h2>
            <a class="btn btn-primary"
               th:href="@{/admin/initiatives/{initiativeId}/events/{eventId}/attendance/new(initiativeId=${initiative.id},eventId=${event.id})}" th:text="#{attendance.record}">Record Attendance</a>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th th:text="#{common.volunteer}">Volunteer</th>
                    <th th:text="#{common.type}">Type</th>
                    <th th:text="#{common.when}">When</th>
                    <th th:text="#{common.note}">Note</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="attend : ${attendances}">
                    <td th:text="${attend.volunteerInitiative != null and attend.volunteerInitiative.user != null ? attend.volunteerInitiative.user.username : '-'}"></td>
                    <td th:switch="${attend.attendInOut}">
                        <span th:case="1" th:text="#{attend.type.1}">Check-in</span>
                        <span th:case="2" th:text="#{attend.type.2}">Check-out</span>
                        <span th:case="*">-</span>
                    </td>
                    <td th:text="${attend.attendDttm != null ? #temporals.format(attend.attendDttm, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                    <td th:text="${attend.note != null ? attend.note : '-'}"></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/admin/initiatives/{initiativeId}/events/{eventId}/attendance/{id}/edit(initiativeId=${initiative.id},eventId=${event.id},id=${attend.id})}" th:text="#{common.edit}">Edit</a>
                        <form th:action="@{/admin/initiatives/{initiativeId}/events/{eventId}/attendance/{id}/delete(initiativeId=${initiative.id},eventId=${event.id},id=${attend.id})}"
                              method="post" class="d-inline" th:data-confirm="#{attendance.confirmDelete}" onsubmit="return confirm(this.dataset.confirm);">
                            <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{common.delete}">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(attendances)}">
                    <td colspan="5" class="text-muted" th:text="#{attendance.empty}">No attendance recorded yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
