<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=${eventId} != null ? #{events.edit} : #{events.new})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Shared by the admin area and the coordinator pages: eventsPath is the events list URL (defaults to the admin one) -->
    <div class="container" style="max-width: 560px;"
         th:with="eventsPath=${eventsPath != null ? eventsPath : '/admin/initiatives/' + initiative.id + '/events'}">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb" th:with="fromCoordinator=${#strings.startsWith(eventsPath, '/coordinator')}">
            <th:block th:if="${fromCoordinator}">
                <li th:replace="~{fragments/layout :: crumb(#{nav.coordinator}, '/coordinator/initiatives')}"></li>
                <li th:replace="~{fragments/layout :: crumbText(${initiative.name})}"></li>
            </th:block>
            <th:block th:unless="${fromCoordinator}">
                <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
                <li th:replace="~{fragments/layout :: crumb(#{initiatives.title}, '/admin/initiatives')}"></li>
                <li th:replace="~{fragments/layout :: crumb(${initiative.name}, ${'/admin/initiatives/' + initiative.id + '/edit'})}"></li>
            </th:block>
            <li th:replace="~{fragments/layout :: crumb(#{adminInitiatives.events}, ${eventsPath})}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(${eventId} != null ? #{events.edit} : #{events.new})}"></li>
        </ol></nav>

        <h2 class="mb-4" th:text="${eventId} != null ? #{events.editHeading(${initiative.name})} : #{events.newHeading(${initiative.name})}">Event</h2>

        <form th:action="${eventId} != null ? @{|${eventsPath}/${eventId}|} : @{${eventsPath}}"
              th:object="${eventForm}" method="post">

            <div class="mb-3">
                <label for="name" class="form-label" th:text="#{common.name}">Name</label>
                <input type="text" class="form-control" id="name" th:field="*{name}">
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label for="fromDttm" class="form-label" th:text="#{common.from}">From</label>
                    <input type="datetime-local" class="form-control" id="fromDttm" th:field="*{fromDttm}">
                </div>
                <div class="col">
                    <label for="toDttm" class="form-label" th:text="#{common.to}">To</label>
                    <input type="datetime-local" class="form-control" id="toDttm" th:field="*{toDttm}">
                </div>
            </div>

            <div class="mb-3">
                <label for="locUrl" class="form-label" th:text="#{events.locationUrl}">Location URL</label>
                <input type="text" class="form-control" id="locUrl" th:field="*{locUrl}" placeholder="https://maps.example.com/..." dir="ltr">
                <div class="text-danger" th:if="${#fields.hasErrors('locUrl')}" th:errors="*{locUrl}"></div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label for="locLatitude" class="form-label" th:text="#{events.latitude}">Latitude</label>
                    <input type="number" step="any" class="form-control" id="locLatitude" th:field="*{locLatitude}">
                </div>
                <div class="col">
                    <label for="locLongitude" class="form-label" th:text="#{events.longitude}">Longitude</label>
                    <input type="number" step="any" class="form-control" id="locLongitude" th:field="*{locLongitude}">
                </div>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="enabled" th:field="*{enabled}">
                <label class="form-check-label" for="enabled" th:text="#{common.enabled}">Enabled</label>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{${eventsPath}}" th:text="#{common.cancel}">Cancel</a>
        </form>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
