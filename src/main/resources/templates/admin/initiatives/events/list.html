<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{events.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <li th:replace="~{fragments/layout :: crumb(#{admin.title}, '/admin')}"></li>
            <li th:replace="~{fragments/layout :: crumb(#{initiatives.title}, '/admin/initiatives')}"></li>
            <li th:replace="~{fragments/layout :: crumb(${initiative.name}, ${'/admin/initiatives/' + initiative.id + '/edit'})}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(#{adminInitiatives.events})}"></li>
        </ol></nav>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 th:text="#{events.heading(${initiative.name})}">Events</h2>
            <a class="btn btn-primary" th:href="@{/admin/initiatives/{id}/events/new(id=${initiative.id})}" th:text="#{events.new}">New Event</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th th:text="#{common.name}">Name</th>
                        <th th:text="#{common.from}">From</th>
                        <th th:text="#{common.to}">To</th>
                        <th th:text="#{events.location}">Location</th>
                        <th th:text="#{common.enabled}">Enabled</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="event : ${events}">
                        <td><bdi th:text="${event.name}"></bdi></td>
                        <td th:text="${event.fromDttm != null ? #temporals.format(event.fromDttm, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                        <td th:text="${event.toDttm != null ? #temporals.format(event.toDttm, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                        <td>
                            <a th:if="${event.locUrl != null and !event.locUrl.isEmpty()}" th:href="${event.locUrl}" target="_blank" th:text="#{events.map}">Map</a>
                            <span th:unless="${event.locUrl != null and !event.locUrl.isEmpty()}">-</span>
                        </td>
                        <td th:text="${event.enabled != null and event.enabled} ? #{common.yes} : #{common.no}"></td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/coordinator/initiatives/{initiativeId}/events/{id}/checkin(initiativeId=${initiative.id},id=${event.id})}" th:text="#{checkinQr.open}">Check-in QR</a>
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/admin/initiatives/{initiativeId}/events/{eventId}/attendance(initiativeId=${initiative.id},eventId=${event.id})}" th:text="#{events.attendance}">Attendance</a>
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/admin/initiatives/{initiativeId}/events/{id}/edit(initiativeId=${initiative.id},id=${event.id})}" th:text="#{common.edit}">Edit</a>
                            <form th:action="@{/admin/initiatives/{initiativeId}/events/{id}/delete(initiativeId=${initiative.id},id=${event.id})}"
                                  method="post" class="d-inline" th:data-confirm="#{events.confirmDelete}" onsubmit="return confirm(this.dataset.confirm);">
                                <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{common.delete}">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(events)}">
                        <td colspan="6" class="text-muted" th:text="#{events.empty}">No events yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
