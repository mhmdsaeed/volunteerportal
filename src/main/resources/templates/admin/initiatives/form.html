<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=${initiativeId} != null ? #{adminInitiatives.edit} : #{adminInitiatives.new})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container" style="max-width: 560px;">
        <h2 class="mb-4" th:text="${initiativeId} != null ? #{adminInitiatives.edit} : #{adminInitiatives.new}">Initiative</h2>

        <form th:action="${initiativeId} != null ? @{/admin/initiatives/{id}(id=${initiativeId})} : @{/admin/initiatives}"
              th:object="${initiativeForm}" method="post">

            <div class="mb-3">
                <label for="name" class="form-label" th:text="#{common.name}">Name</label>
                <input type="text" class="form-control" id="name" th:field="*{name}">
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label" th:text="#{common.description}">Description</label>
                <textarea class="form-control" id="description" rows="3" th:field="*{description}"></textarea>
                <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="mb-3">
                <label for="officeId" class="form-label" th:text="#{common.office}">Office</label>
                <select class="form-select" id="officeId" th:field="*{officeId}">
                    <option value="" th:text="#{common.none}">-- None --</option>
                    <option th:each="office : ${offices}" th:value="${office.id}" th:text="${office.name}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label for="supervisorId" class="form-label" th:text="#{common.supervisor}">Supervisor</label>
                <select class="form-select" id="supervisorId" th:field="*{supervisorId}">
                    <option value="" th:text="#{common.none}">-- None --</option>
                    <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option>
                </select>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="enabled" th:field="*{enabled}">
                <label class="form-check-label" for="enabled" th:text="#{common.enabled}">Enabled</label>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/initiatives}" th:text="#{common.cancel}">Cancel</a>
        </form>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
