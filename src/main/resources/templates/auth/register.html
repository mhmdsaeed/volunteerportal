<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{register.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main id="main" class="container">
        <div class="vp-auth">
            <div class="vp-auth-form">
                <h1 class="mb-4" th:text="#{register.title}">Register</h1>

                <form th:action="@{/register}" th:object="${registrationForm}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label" th:text="#{common.username}">Username</label>
                        <input type="text" class="form-control" id="username" th:field="*{username}" th:errorclass="is-invalid"
                               th:aria-invalid="${#fields.hasErrors('username')} ? 'true'" th:aria-describedby="${#fields.hasErrors('username')} ? 'username-error'"
                               autocomplete="username" autocapitalize="none" spellcheck="false">
                        <div class="text-danger" id="username-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label" th:text="#{common.email}">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" th:errorclass="is-invalid"
                               th:aria-invalid="${#fields.hasErrors('email')} ? 'true'" th:aria-describedby="${#fields.hasErrors('email')} ? 'email-error'" dir="ltr" autocomplete="email">
                        <div class="text-danger" id="email-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label" th:text="#{common.password}">Password</label>
                        <input type="password" class="form-control" id="password" th:field="*{password}" th:errorclass="is-invalid"
                               th:aria-invalid="${#fields.hasErrors('password')} ? 'true'" th:aria-describedby="${#fields.hasErrors('password')} ? 'passwordHelp password-error' : 'passwordHelp'"
                               autocomplete="new-password">
                        <div class="form-text" id="passwordHelp" th:text="#{register.passwordHelp}">At least 8 characters.</div>
                        <div class="text-danger" id="password-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label" th:text="#{register.confirmPassword}">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" th:errorclass="is-invalid"
                               th:aria-invalid="${#fields.hasErrors('confirmPassword')} ? 'true'" th:aria-describedby="${#fields.hasErrors('confirmPassword')} ? 'confirmPassword-error'"
                               autocomplete="new-password">
                        <div class="text-danger" id="confirmPassword-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" th:text="#{register.submit}">Register</button>
                </form>

                <p class="mt-3">
                    <span th:text="#{register.haveAccount}">Already have an account?</span>
                    <a th:href="@{/login}" th:text="#{register.loginLink}">Login here</a>
                </p>
            </div>

            <div class="vp-auth-intro vp-lanyard">
                <p class="vp-auth-name" th:text="#{app.name}">Volunteer Portal</p>
                <p th:text="#{auth.tagline}">Join initiatives, see your upcoming events, and check in with your phone when you arrive.</p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
