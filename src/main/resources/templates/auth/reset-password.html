<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{reset.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main id="main" class="container">
        <div class="vp-auth">
            <div class="vp-auth-form">
                <h1 class="mb-4" th:text="#{reset.title}">Choose a new password</h1>

                <th:block th:unless="${valid}">
                    <div class="alert alert-warning" th:text="#{reset.invalid}">This link has expired or was already used.</div>
                    <a class="btn btn-primary" th:href="@{/forgot-password}" th:text="#{reset.requestNew}">Request a new link</a>
                </th:block>

                <form th:if="${valid}" th:action="@{/reset-password}" th:object="${resetForm}" method="post">
                    <input type="hidden" th:field="*{token}">
                    <p class="text-muted" th:text="#{reset.help}">At least 8 characters.</p>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label" th:text="#{profile.password.new}">New password</label>
                        <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}" th:errorclass="is-invalid"
                               th:aria-invalid="${#fields.hasErrors('newPassword')} ? 'true'" th:aria-describedby="${#fields.hasErrors('newPassword')} ? 'newPassword-error'"
                               autocomplete="new-password" required autofocus>
                        <div class="text-danger" id="newPassword-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label" th:text="#{profile.password.confirm}">Confirm new password</label>
                        <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" th:errorclass="is-invalid"
                               th:aria-invalid="${#fields.hasErrors('confirmPassword')} ? 'true'" th:aria-describedby="${#fields.hasErrors('confirmPassword')} ? 'confirmPassword-error'"
                               autocomplete="new-password" required>
                        <div class="text-danger" id="confirmPassword-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" th:text="#{reset.submit}">Save new password</button>
                </form>

                <p class="mt-3"><a th:href="@{/login}" th:text="#{forgot.backToLogin}">Back to login</a></p>
            </div>

            <div class="vp-auth-intro vp-lanyard">
                <p class="vp-auth-name" th:text="#{app.name}">Volunteer Portal</p>
                <p th:text="#{auth.tagline}">Join initiatives, see your upcoming events, and check in with your phone when you arrive.</p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
