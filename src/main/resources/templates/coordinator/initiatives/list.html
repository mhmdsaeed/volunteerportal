<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Coordinator')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <h2 class="mb-4">Your Initiatives</h2>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Office</th>
                    <th>Enabled</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="initiative : ${initiatives}">
                    <td th:text="${initiative.name}"></td>
                    <td th:text="${initiative.office != null ? initiative.office.name : '-'}"></td>
                    <td th:text="${initiative.enabled != null and initiative.enabled ? 'Yes' : 'No'}"></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/coordinator/initiatives/{id}/requests(id=${initiative.id})}">Join Requests</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(initiatives)}">
                    <td colspan="4" class="text-muted">No initiatives assigned to you.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
