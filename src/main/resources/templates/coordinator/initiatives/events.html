<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{events.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <li th:replace="~{fragments/layout :: crumb(#{nav.coordinator}, '/coordinator/initiatives')}"></li>
            <li th:replace="~{fragments/layout :: crumbText(${initiative.name})}"></li>
            <li th:replace="~{fragments/layout :: crumbHere(#{adminInitiatives.events})}"></li>
        </ol></nav>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h1 th:text="#{events.heading(${initiative.name})}">Events</h1>
            <a class="btn btn-primary" th:href="@{/coordinator/initiatives/{id}/events/new(id=${initiative.id})}" th:text="#{events.new}">New Event</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th th:text="#{common.name}">Name</th>
                        <th th:text="#{common.from}">From</th>
                        <th th:text="#{common.to}">To</th>
                        <th th:text="#{events.location}">Location</th>
                        <th th:text="#{common.enabled}">Enabled</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="event : ${events}">
                        <td><bdi th:text="${event.name}"></bdi></td>
                        <td class="text-nowrap" th:text="${event.fromDttm != null ? #temporals.format(event.fromDttm, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                        <td class="text-nowrap" th:text="${event.toDttm != null ? #temporals.format(event.toDttm, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                        <td>
                            <a th:if="${event.locUrl != null and !event.locUrl.isEmpty()}" th:href="${event.locUrl}" target="_blank" rel="noopener" th:text="#{events.map}">Map</a>
                            <span th:unless="${event.locUrl != null and !event.locUrl.isEmpty()}">-</span>
                        </td>
                        <td th:text="${event.enabled != null and event.enabled} ? #{common.yes} : #{common.no}"></td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/coordinator/initiatives/{initiativeId}/events/{id}/checkin(initiativeId=${initiative.id},id=${event.id})}" th:text="#{checkinQr.open}">Check-in QR</a>
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/coordinator/initiatives/{initiativeId}/events/{id}/attendance(initiativeId=${initiative.id},id=${event.id})}" th:text="#{events.attendance}">Attendance</a>
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/coordinator/initiatives/{initiativeId}/events/{id}/edit(initiativeId=${initiative.id},id=${event.id})}" th:text="#{common.edit}">Edit</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(events)}">
                        <td colspan="6" class="text-muted" th:text="#{events.empty}">No events yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
