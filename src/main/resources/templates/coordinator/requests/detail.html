<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="#{app.lang}" th:dir="#{app.dir}">
<head th:replace="~{fragments/layout :: head(title=#{requestDetail.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container" th:with="initiativeRequests=${'/coordinator/initiatives/' + request.initiative.id + '/requests'},
                                    pending=${request.responseJoinDttm == null}">
        <nav th:aria-label="#{nav.breadcrumb}"><ol class="breadcrumb">
            <th:block th:if="${fromInitiative}">
                <li th:replace="~{fragments/layout :: crumb(#{nav.coordinator}, '/coordinator/initiatives')}"></li>
                <li th:replace="~{fragments/layout :: crumb(${request.initiative.name}, ${initiativeRequests})}"></li>
            </th:block>
            <th:block th:unless="${fromInitiative}">
                <li th:replace="~{fragments/layout :: crumb(#{pendingRequests.title}, '/coordinator/requests')}"></li>
            </th:block>
            <li th:replace="~{fragments/layout :: crumbHere(#{requestDetail.title})}"></li>
        </ol></nav>

        <h2 class="mb-3" th:text="#{requestDetail.heading(${request.user != null ? request.user.username : '-'})}">Join request from sara</h2>

        <dl class="row mb-4 vp-request-facts">
            <dt class="col-sm-3" th:text="#{common.initiative}">Initiative</dt>
            <dd class="col-sm-9"><a th:href="@{${initiativeRequests}}" th:text="${request.initiative.name}"></a></dd>
            <dt class="col-sm-3" th:if="${request.user != null and request.user.email != null}" th:text="#{common.email}">Email</dt>
            <dd class="col-sm-9" th:if="${request.user != null and request.user.email != null}"><span dir="ltr" th:text="${request.user.email}"></span></dd>
            <dt class="col-sm-3" th:text="#{common.requested}">Requested</dt>
            <dd class="col-sm-9" th:text="${request.requestJoinDttm != null ? #temporals.format(request.requestJoinDttm, 'yyyy-MM-dd HH:mm') : '-'}"></dd>
            <dt class="col-sm-3" th:text="#{common.status}">Status</dt>
            <dd class="col-sm-9">
                <span th:if="${pending}" class="badge text-bg-warning" th:text="#{status.pending}">Pending</span>
                <span th:if="${!pending and request.enabled == true}" class="badge text-bg-success" th:text="#{status.approved}">Approved</span>
                <span th:if="${!pending and request.enabled != true}" class="badge text-bg-danger" th:text="#{status.notApproved}">Not approved</span>
            </dd>
        </dl>

        <h3 class="h5 mb-3" th:text="#{common.answers}">Answers</h3>
        <p th:if="${#lists.isEmpty(answers)}" class="text-muted" th:text="#{requestDetail.noQuestions}">This initiative has no questions.</p>
        <ol th:unless="${#lists.isEmpty(answers)}" class="list-group list-group-numbered mb-4 vp-answers">
            <li class="list-group-item" th:each="row : ${answers}">
                <div class="vp-answer-question" th:text="${row.question}" dir="auto">Are you over 18?</div>
                <div th:if="${row.answer == null}" class="text-muted" th:text="#{requestDetail.notAnswered}">Not answered</div>
                <div th:if="${row.answer != null and row.typeId == 1}" class="vp-answer"
                     th:text="${row.choiceNumber == 1} ? #{common.yes} : #{common.no}">Yes</div>
                <div th:if="${row.answer != null and row.typeId != 1}" class="vp-answer" th:text="${row.answer}" dir="auto">An answer</div>
            </li>
        </ol>

        <div th:if="${pending}" class="d-flex flex-wrap gap-2">
            <form method="post" th:action="${fromInitiative}
                    ? @{/coordinator/initiatives/{initiativeId}/requests/{requestId}/approve(initiativeId=${request.initiative.id},requestId=${request.id})}
                    : @{/coordinator/requests/{requestId}/approve(requestId=${request.id})}">
                <button type="submit" class="btn btn-success" th:text="#{joinRequests.approve}">Approve</button>
            </form>
            <form method="post" th:action="${fromInitiative}
                    ? @{/coordinator/initiatives/{initiativeId}/requests/{requestId}/reject(initiativeId=${request.initiative.id},requestId=${request.id})}
                    : @{/coordinator/requests/{requestId}/reject(requestId=${request.id})}"
                  th:data-confirm="#{joinRequests.rejectConfirm}" onsubmit="return confirm(this.dataset.confirm);">
                <button type="submit" class="btn btn-danger" th:text="#{joinRequests.reject}">Reject</button>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
