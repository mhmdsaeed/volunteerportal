spring:
  application:
    name: volunteerportal
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:volunteerportal}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:volunteerportal_app}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}

app:
  seed-admin:
    enabled: ${SEED_ADMIN:true}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_DEFAULT_PASSWORD:admin123}
    email: ${ADMIN_EMAIL:admin@volunteerportal.local}

logging:
  level:
    org.springframework.security: INFO
