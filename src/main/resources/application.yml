spring:
  application:
    name: volunteerportal
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:volunteerportal}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:volunteerportal_app}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  messages:
    basename: messages
    encoding: UTF-8
    # Otherwise an English request could fall back to messages_ar on an Arabic-locale server
    fallback-to-system-locale: false
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}

app:
  api:
    # How long a mobile app login (bearer token) lasts; logging out revokes it sooner
    token-validity: 30d
  checkin:
    # Signs the rotating QR check-in codes. Set CHECKIN_SECRET in any real deployment (and the same
    # value on every instance); if empty, a random secret is generated at startup.
    secret: ${CHECKIN_SECRET:}
    code-period: 30s        # a new code every 30 seconds
    code-max-age: 120s      # a scanned code stays valid this long (time to log in first)
    max-distance-meters: 300 # for events with coordinates, how close the phone must be
  seed-admin:
    enabled: ${SEED_ADMIN:true}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_DEFAULT_PASSWORD:admin123}
    email: ${ADMIN_EMAIL:admin@volunteerportal.local}

logging:
  level:
    org.springframework.security: INFO
