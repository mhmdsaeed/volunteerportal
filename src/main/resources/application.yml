spring:
  application:
    name: volunteerportal
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:volunteerportal}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:volunteerportal_app}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  messages:
    basename: messages
    encoding: UTF-8
    # Otherwise an English request could fall back to messages_ar on an Arabic-locale server
    fallback-to-system-locale: false
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
  # Outgoing email, used only for "Forgot your password?" links. Off while MAIL_HOST is empty: the page then
  # tells people to ask an administrator, who can set a new password under Admin > Users.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      # Don't let a slow mail server hold a thread for long
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}

app:
  api:
    # How long a mobile app login (bearer token) lasts; logging out revokes it sooner
    token-validity: 30d
    # Browser origins allowed to call the API (CORS). Empty = none; native phone apps don't need it.
    cors-allowed-origin-patterns:
  checkin:
    # Signs the rotating QR check-in codes. Set CHECKIN_SECRET in any real deployment (and the same
    # value on every instance); if empty, a random secret is generated at startup.
    secret: ${CHECKIN_SECRET:}
    code-period: 30s        # a new code every 30 seconds
    code-max-age: 120s      # a scanned code stays valid this long (time to log in first)
    max-distance-meters: 300 # for events with coordinates, how close the phone must be
    opens-before: 60m       # check-in opens this long before the event starts and closes when it ends
                            # (checking out is never too early, and still possible after the end)
  mail:
    # Sender address of the emails (most mail services require one of your own addresses)
    from: ${MAIL_FROM:}
  password-reset:
    validity: 60m           # an emailed reset link works this long, and only once
    log-links: false        # true (dev profile): also write each link to the server log
  seed-admin:
    enabled: ${SEED_ADMIN:true}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_DEFAULT_PASSWORD:admin123}
    email: ${ADMIN_EMAIL:admin@volunteerportal.local}

logging:
  level:
    org.springframework.security: INFO
